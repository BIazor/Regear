services:
  api:
    build:
      context: ./backend
    environment:
      APP_ENV: production
      DATABASE_PATH: /data/regears.db
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
    ports:
      - "8080:8080"
    volumes:
      - api-data:/data

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  api-data:
